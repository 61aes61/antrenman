<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antrenman Defteri</title>
<meta name="theme-color" content="#0E1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first logbook. One narrow column, bottom tab bar, a rest-timer strip that rises above it. Dark-first for the gym floor. */
:root{
  --bg:#0E1412; --surface:#171F1C; --surface2:#1F2925; --ink:#E8EEEB; --muted:#95A29C; --line:#2A3531;
  --accent:#86A2FF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --good:#6FD3A0; --good-soft:#15301F; --warn:#F2B35B; --danger:#FF8A80;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tabh:64px;
  --g-chest:#F0907A; --g-back:#74B9EE; --g-shoulder:#C7A4F2; --g-arm:#F0C674; --g-leg:#7ED6A5; --g-core:#F09CC4; --g-cardio:#9FB4C7;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F0; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#15201B; --muted:#5B6862; --line:#D5DCD9;
  --accent:#2A52C4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --good:#1C7A4B; --good-soft:#DFF2E7; --warn:#9A5A00; --danger:#B3261E; --g-chest:#C2462C; --g-back:#1F6FB0; --g-shoulder:#7A4CC2; --g-arm:#9A6A00; --g-leg:#1C7A4B; --g-core:#B13A77; --g-cardio:#4F6475; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#15201B; --muted:#5B6862; --line:#D5DCD9;
  --accent:#2A52C4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --good:#1C7A4B; --good-soft:#DFF2E7; --warn:#9A5A00; --danger:#B3261E; --g-chest:#C2462C; --g-back:#1F6FB0; --g-shoulder:#7A4CC2; --g-arm:#9A6A00; --g-leg:#1C7A4B; --g-core:#B13A77; --g-cardio:#4F6475; color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:12px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:grid;gap:14px}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:grid;justify-items:center;text-align:center;gap:2px;padding-top:4px}
h1{font-family:var(--body);font-weight:700;font-size:1.45rem;line-height:1.2;margin:0}
.sub{color:var(--muted);font-size:.9rem}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:6px 0 0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 1.05rem var(--display);letter-spacing:.04em;text-transform:uppercase;padding:9px 6px;border-radius:7px;cursor:pointer;position:relative}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .dsub{display:block;font:600 .72rem var(--body);letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:1px}
.seg .next{color:var(--accent)}
.seg button[aria-pressed="true"] .dsub,.seg button[aria-pressed="true"] .next{color:var(--bg);opacity:.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.note{font-size:.92rem;color:var(--muted);margin:0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ex.complete{border-color:var(--good)}
.ex-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.leg{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.ss{background:transparent;color:var(--warn);border-color:var(--warn)}
.ex h3{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;margin:0;min-width:0}
.tgt{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tgt small{font:600 .75rem var(--body);color:var(--muted);display:block;text-align:right}
.last{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.up{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--good-soft);color:var(--good);margin-left:4px;white-space:nowrap}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.set.bw{grid-template-columns:28px minmax(0,1fr) 52px}
.set .sn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:1.1rem}
.field{position:relative;min-width:0}
.field input{width:100%;font:600 1.1rem var(--body);font-variant-numeric:tabular-nums;padding:10px 40px 10px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.field input::placeholder{color:var(--muted);opacity:.7}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);font-weight:600;pointer-events:none}
.chk{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-size:1.3rem;font-weight:700;cursor:pointer;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.set.done input{border-color:var(--good-soft);background:var(--good-soft)}
details.how{border-top:1px dashed var(--line);padding-top:8px}
details.how summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.92rem;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+ "}
details.how[open] summary::before{content:"– "}
.how ul{margin:8px 0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.vid{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:.92rem}
.vid::before{content:"";width:0;height:0;border-left:9px solid var(--danger);border-top:6px solid transparent;border-bottom:6px solid transparent}
.primary{font:700 1.25rem var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;cursor:pointer;width:100%}
.primary:disabled{opacity:.5}
.ghost{font:600 .9rem var(--body);background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
.ghost.danger{color:var(--danger);border-color:var(--danger)}
.msg{font-size:.92rem;color:var(--muted);margin:0}
.msg.err{color:var(--danger)}
.cardio{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.cardio b{font-family:var(--display);font-size:1.25rem}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.sess summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none;font-weight:600}
details.sess summary::-webkit-details-marker{display:none}
.daychip{font-family:var(--display);font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 8px;letter-spacing:.04em;white-space:nowrap}
.sess ul{margin:10px 0;padding:0;list-style:none;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.sess li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:5px;font-size:.95rem}
.sess li span{text-align:right;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 14px;border:1px dashed var(--line);border-radius:14px}
.lib{display:grid;gap:10px}
.lib .ex h3{font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:2px}
.stat strong{font-family:var(--display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.wform label{display:grid;gap:4px;min-width:0}
.wform input{font:600 1rem var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.wlist{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.wlist li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 .78rem var(--body);letter-spacing:.04em;text-transform:uppercase;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
#rest{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:29;padding:0 12px 10px}
#rest .card{max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 12px;display:grid;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#rest .r1{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px}
#rest-t{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;min-width:64px}
#rest-l{min-width:0;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest button{white-space:nowrap;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font-weight:700;font-size:.85rem;cursor:pointer}
#rest .bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
#rest.ready .card{background:var(--good);color:var(--bg)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.95rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:.3;transform:translate(-50%,-6px)}}}

.plans{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.plans button{border:0;background:transparent;color:var(--ink);font:600 .95rem var(--body);letter-spacing:.03em;padding:9px 2px 7px;border-radius:9px;cursor:pointer;display:grid;gap:1px;justify-items:center}
.plans button small{font:500 .68rem var(--body);color:var(--muted);letter-spacing:.02em}
.plans button small.nx{color:var(--accent);font-weight:700}
.plans button[aria-pressed="true"]{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.notes summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;font-weight:600;font-size:1.05rem}
.notes summary::-webkit-details-marker{display:none}
.notes summary svg{width:24px;height:24px}
.notes summary .chev{width:18px;height:18px;transition:transform .2s;fill:none;stroke:currentColor;stroke-width:2.5}
.notes[open] summary .chev{transform:rotate(180deg)}
.notes .nb{padding:0 14px 14px;display:grid;gap:10px}
.hh{font-family:var(--body);font-weight:700;font-size:1.6rem;color:var(--muted);margin:6px 0 -4px;text-transform:none;letter-spacing:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.exrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 14px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.list>.exrow:first-child{border-top:0}
.exrow:active{background:var(--surface2)}
.thumb{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font:700 1.4rem var(--display);letter-spacing:.03em;color:var(--g);background:color-mix(in srgb,var(--g) 16%,var(--surface2));border:1px solid color-mix(in srgb,var(--g) 30%,transparent)}
.exrow .txt,.crow .txt{display:grid;gap:1px;min-width:0}
.exrow .nm{font-weight:600;font-size:1.06rem;line-height:1.25}
.exrow .sr{font-variant-numeric:tabular-nums}
.exrow .rg,.crow .rg{color:var(--muted);font-size:.92rem}
.prog{width:38px;height:38px}
.prog circle{fill:none;stroke-width:4}
.ssg{background:color-mix(in srgb,var(--accent) 14%,var(--surface));position:relative;border-top:1px solid var(--line)}
.list>.ssg:first-child{border-top:0}
.ssg .exrow{border-top-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.ssg>.exrow:first-of-type{border-top:0}
.ssb{position:absolute;right:0;bottom:0;background:var(--accent);color:var(--accent-ink);font:700 .72rem var(--body);letter-spacing:.04em;padding:3px 9px;border-top-left-radius:8px}
.crow{display:grid;grid-template-columns:64px minmax(0,1fr) 96px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.back{justify-self:start;border:0;background:transparent;color:var(--accent);font:600 1rem var(--body);padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.dnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dnav button{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 .95rem var(--body);cursor:pointer;color:var(--ink);min-width:0}
.dnav button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dhead{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.dhead .thumb{width:72px;height:72px}

/* ---- compact pass ---- */
body{font-size:15px}
#app{gap:10px}
h1{font-size:1.15rem}
.top .sub{font-size:.8rem}
.switch{display:grid;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:20;background:var(--bg);padding-block:4px}
.mseg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.mseg button{border:0;background:transparent;color:var(--muted);font:700 .95rem var(--body);padding:8px;border-radius:8px;cursor:pointer}
.mseg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dseg{display:flex;gap:8px;flex-wrap:wrap}
.dseg button{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 .85rem var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
.dseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dseg i{font-style:normal;font-size:.66rem;font-weight:700;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent);padding:1px 6px;border-radius:99px}
.notes summary{padding:9px 12px;font-size:.95rem;gap:10px}
.notes summary svg{width:20px;height:20px}
.toggle{font-size:.92rem}
.toggle input{width:18px;height:18px}
.hh{font-size:1.1rem;margin:2px 0 -4px}
.exrow{grid-template-columns:46px minmax(0,1fr) auto;gap:12px;padding:8px 12px}
.thumb{width:46px;height:46px;border-radius:10px;font-size:1.05rem}
.exrow .nm{font-size:.98rem}
.exrow .rg{font-size:.85rem}
.exrow .sr{color:var(--ink);font-weight:600}
.prog{width:30px;height:30px}
.ssb{font-size:.64rem;padding:2px 7px}
.crow{grid-template-columns:46px minmax(0,1fr) 84px;gap:12px;padding:8px 12px}
.crow .field input{padding:7px 30px 7px 8px;font-size:.95rem}
.primary{font-size:1.1rem;padding:12px;border-radius:10px}
.ex{padding:12px;gap:8px;border-radius:12px}
.dhead{grid-template-columns:52px minmax(0,1fr);gap:12px}
.dhead .thumb{width:52px;height:52px;font-size:1.15rem}
.dt{min-width:0;display:grid;gap:2px}
.ex h3{font-size:1.25rem}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{gap:5px}
.set{grid-template-columns:22px 62px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px}
.set.bw{grid-template-columns:22px 62px minmax(0,1fr) 40px}
.set.hdr span{font-size:.64rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center}
.set .sn{font-size:1rem}
.set .pv{font-size:.82rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .in{width:100%;font:600 1rem var(--body);font-variant-numeric:tabular-nums;text-align:center;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.set .in::placeholder{color:var(--muted);opacity:.6}
.set.done .in{background:var(--good-soft);border-color:transparent}
.chk{height:34px;border-radius:8px;font-size:1rem}
details.how summary{font-size:.88rem}
.how ul{font-size:.9rem}
.dnav button{padding:10px 8px;font-size:.88rem}
.back{font-size:.92rem;padding:2px 0}
.tabs .in{height:58px}
.tabs button{font-size:.68rem}
.tabs button svg{width:22px;height:22px}
:root{--tabh:58px}
/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.tile strong{font-family:var(--display);font-size:1.25rem;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile strong small{font:600 .7rem var(--body);color:var(--muted)}
.tile{padding:8px}
.tile .lbl{font-size:.62rem}
/* ---- summary sheet ---- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;align-items:end}
.sheet-in{background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-width:560px;width:100%;margin:0 auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:grid;gap:12px}
@media (prefers-reduced-motion: no-preference){.sheet-in{animation:up .25s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

.pr{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 8px}

.fig figcaption{font-size:.75rem;color:var(--muted);font-weight:600}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}

.bars{display:grid;gap:6px}

.bar .track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}

.set,.set.bw{grid-template-columns:24px 70px minmax(0,1fr) 44px}

.vbox.paused .vhint::after{content:" · durdu"}

.vbox.real video{display:block;width:100%;height:200px;object-fit:contain;background:#000}

.credit{font-size:.72rem;color:var(--muted);justify-self:end;margin-top:-4px}

function drawChart(){
  const el=$('#chart');if(!el)return;
  const w=[...weights].sort((a,b)=>a.date<b.date?-1:1);
  if(w.length<2){el.innerHTML='<p class="note">İkinci tartını eklediğinde grafik burada çizilir.</p>';return}
  const W=340,H=150,pl=34,pr=12,pt=12,pb=24;
  const t=w.map(x=>new Date(x.date+'T12:00').getTime()),ks=w.map(x=>x.kg);
  const lo=Math.floor(Math.min(...ks)-1),hi=Math.ceil(Math.max(...ks)+1),mid=Math.round((lo+hi)/2);
  const t0=t[0],t1=t[t.length-1];
  const X=v=>pl+(W-pl-pr)*((v-t0)/((t1-t0)||1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));

  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]},${Y(lo)} L${line.split(' ').join(' L')} L${pts[pts.length-1][0]},${Y(lo)} Z`;
  const L=pts[pts.length-1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği">
   ${[lo,mid,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`).join('')}
   <path d="${area}" style="fill:var(--accent);opacity:.14"/>
   <polyline points="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${L[0]}" cy="${L[1]}" r="4.5" style="fill:var(--accent)"/>
   <text x="${pl}" y="${H-6}" font-size="11" style="fill:var(--muted)">${esc(fmtD(w[0].date))}</text>

}

/* ---------- Rest timer ---------- */
let timer={end:0,total:0,iv:null,label:''},actx=null;
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}}
function startRest(sec,label){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}else if(actx.state==='suspended')actx.resume()}catch(e){}
  timer.end=Date.now()+sec*1000;timer.total=sec;timer.label=label;
  const r=$('#rest');r.hidden=false;r.classList.remove('ready');
  clearInterval(timer.iv);timer.iv=setInterval(tick,250);tick();
}
function tick(){
  const left=Math.max(0,Math.round((timer.end-Date.now())/1000));
  const m=Math.floor(left/60),s=left%60;
  $('#rest-t').textContent=m+':'+String(s).padStart(2,'0');
  $('#rest-l').textContent=left?'Dinlenme · sıradaki: '+timer.label:'Hazırsın · '+timer.label;
  $('#rest-bar').style.transform='scaleX('+(timer.total?left/timer.total:0)+')';
  if(!left){clearInterval(timer.iv);timer.iv=null;$('#rest').classList.add('ready');beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(!timer.iv)$('#rest').hidden=true},4000)}
}

  const d=getDraft(),P=PROGRAMS[prog];
  const ex={};
  P.days[day].ex.forEach(k=>{if(noLegs&&LIB[k].leg)return;const e=LIB[k];const a=exSets(k).map(x=>({kg:e.t==='kg'?num(x.kg):null,reps:num(x.reps),done:!!x.done}));if(a.some(x=>x.done))ex[k]=a});
  const cardio=num(d.cardio);
  if(!Object.keys(ex).length&&!cardio){saveErr='Kaydetmek için en az bir seti ✓ ile işaretle.';render();return}
  saving=true;saveErr='';render();
  const doc={date:d.date||today(),program:prog,day,ex,createdAt:Date.now()};
  if(cardio)doc.cardio=cardio;if(noLegs)doc.noLegs=true;
  if(d.startedAt)doc.duration=Math.max(1,Math.round((Date.now()-d.startedAt)/60000));
  const hist=sessions.slice();
  try{await addSession(doc);delete drafts[draftKey()];saveDrafts();saving=false;day=null;noLegs=false;window.scrollTo(0,0);render();showSummary(doc,hist)}
  catch(e){saving=false;saveErr='Kaydedilemedi. Telefonda yer kalmamış olabilir; tekrar dene.';render()}
}

/* ---------- Summary card ---------- */
const TROPHY='<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg>';
function bestOf(e,arr){let b=null;arr.forEach(x=>{if(e.t==='kg'){if(x.kg==null)return;if(!b||x.kg>b.kg||(x.kg===b.kg&&(x.reps||0)>(b.reps||0)))b=x}else if(!b||(x.reps||0)>(b.reps||0))b=x});return b}
function histBest(k,hist){const e=LIB[k];let v=null;hist.forEach(s=>{const a=s.ex&&s.ex[k];if(!a)return;const x=bestOf(e,a.filter(z=>z.done));if(!x)return;const y=e.t==='kg'?x.kg:x.reps;if(v==null||y>v)v=y});return v}
function summaryHTML(doc,hist){
  let vol=0,sets=0,prs=0;const rows=[];
  for(const k of Object.keys(doc.ex||{})){const e=LIB[k];if(!e)continue;const done=doc.ex[k].filter(z=>z.done);if(!done.length)continue;sets+=done.length;
    if(e.t==='kg')done.forEach(z=>vol+=(z.kg||0)*(z.reps||0));
    const b=bestOf(e,done),hb=histBest(k,hist),v=b?(e.t==='kg'?b.kg:b.reps):null,pr=b&&hb!=null&&v>hb;if(pr)prs++;
    const bt=b?((e.t==='kg'&&b.kg!=null?fmtN(b.kg)+' kg × ':'')+(b.reps==null?'?':b.reps)+(e.t==='sn'?' sn':'')):'–';
    rows.push(`<li>${thumb(k)}<span class="txt"><b>${esc(e.n)}</b><span class="rg">${done.length} set · en iyi ${esc(bt)}</span></span>${pr?`<span class="pr">${TROPHY}Rekor</span>`:''}</li>`)}
  const tile=(l,v)=>`<div class="tile"><span class="lbl">${l}</span><strong>${v}</strong></div>`;
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Antrenman özeti"><div class="sheet-in">
    <div><span class="lbl">${esc(fmtD(doc.date))} · ${esc(planName(doc.program,doc.day))}</span><h2 class="sh">Antrenman tamamlandı</h2></div>
    <div class="tiles">${tile('Süre',doc.duration?doc.duration+'<small> dk</small>':'–')}${tile('Hacim',volTxt(vol))}${tile('Set',sets)}${tile('Rekor',prs)}</div>
    <ul class="sumlist">${rows.join('')}${doc.cardio?`<li><span class="thumb" style="--g:var(--g-cardio)" aria-hidden="true">YÜ</span><span class="txt"><b>Eğimli yürüyüş</b><span class="rg">${esc(doc.cardio)} dk</span></span></li>`:''}</ul>
    <button class="primary" type="button" data-close="1">Kapat</button></div></div>`;
}
function volTxt(v){v=Math.round(v);return v>=10000?fmtN((v/1000).toFixed(1))+'<small> ton</small>':v.toLocaleString('tr-TR')+'<small> kg</small>'}
function closeSheet(){document.querySelectorAll('.sheet').forEach(x=>x.remove())}
function showSummary(doc,hist){closeSheet();document.body.insertAdjacentHTML('beforeend',summaryHTML(doc,hist))}

/* ---------- Karne / body map ---------- */
const MUSCLE={chest:'Göğüs',shoulders:'Omuz',upper:'Üst sırt',lats:'Kanat',mid:'Orta sırt',biceps:'Ön kol',triceps:'Arka kol',abs:'Karın',quads:'Ön bacak',hams:'Arka bacak',glutes:'Kalça'};
const R2M={'Göğüs':['chest'],'Üst göğüs':['chest'],'Alt göğüs':['chest'],'Sırt':['lats','mid'],'Üst sırt':['upper','mid'],'Orta sırt':['mid'],'Kanat':['lats'],'Omuz':['shoulders'],'Yan omuz':['shoulders'],'Ön omuz':['shoulders'],'Biceps':['biceps'],'Triceps':['triceps'],'Ön bacak':['quads','glutes'],'Arka bacak':['hams','glutes'],'Bacak':['quads','glutes'],'Kalça':['glutes'],'Karın':['abs'],'Alt karın':['abs']};
function weekStats(){
  const since=Date.now()-7*864e5,c={};Object.keys(MUSCLE).forEach(m=>c[m]=0);let w=0,sets=0,vol=0,mins=0;
  sessions.forEach(s=>{if((s.createdAt||0)<since)return;w++;mins+=s.duration||0;
    Object.keys(s.ex||{}).forEach(k=>{const e=LIB[k];if(!e)return;const done=s.ex[k].filter(z=>z.done);sets+=done.length;
      if(e.t==='kg')done.forEach(z=>vol+=(z.kg||0)*(z.reps||0));(R2M[e.r]||[]).forEach(m=>c[m]+=done.length)})});
  return {c,w,sets,vol,mins};
}
function lvlFill(n){return n===0?'var(--line)':n<4?'color-mix(in srgb,var(--accent) 35%,var(--surface2))':n<8?'color-mix(in srgb,var(--accent) 68%,var(--surface2))':'var(--accent)'}
function bodySVG(c,side){
  const f=m=>`style="fill:${lvlFill(c[m])}"`,B='style="fill:var(--surface2);stroke:var(--line)" stroke-width="1"';
  const base=`<circle cx="60" cy="18" r="11" ${B}/><rect x="54" y="27" width="12" height="10" rx="3" ${B}/>
   <path d="M34 40 Q60 34 86 40 L84 74 Q82 100 78 118 L42 118 Q38 100 36 74 Z" ${B}/>
   <rect x="20" y="46" width="13" height="34" rx="6" ${B}/><rect x="87" y="46" width="13" height="34" rx="6" ${B}/>
   <rect x="17" y="82" width="12" height="34" rx="6" ${B}/><rect x="91" y="82" width="12" height="34" rx="6" ${B}/>
   <path d="M42 116 L78 116 L82 136 L38 136 Z" ${B}/>
   <rect x="39" y="134" width="19" height="62" rx="9" ${B}/><rect x="62" y="134" width="19" height="62" rx="9" ${B}/>
   <rect x="41" y="198" width="15" height="44" rx="7" ${B}/><rect x="64" y="198" width="15" height="44" rx="7" ${B}/>`;
  const front=`<ellipse cx="31" cy="47" rx="9" ry="9" ${f('shoulders')}/><ellipse cx="89" cy="47" rx="9" ry="9" ${f('shoulders')}/>
   <path d="M41 46 Q50 42 59 45 L59 64 Q49 68 41 62 Z" ${f('chest')}/><path d="M79 46 Q70 42 61 45 L61 64 Q71 68 79 62 Z" ${f('chest')}/>
   <rect x="49" y="68" width="22" height="44" rx="5" ${f('abs')}/><path d="M49 82h22M49 96h22M60 68v44" style="stroke:var(--surface)" stroke-width="1.2"/>
   <ellipse cx="26.5" cy="64" rx="5.5" ry="13" ${f('biceps')}/><ellipse cx="93.5" cy="64" rx="5.5" ry="13" ${f('biceps')}/>
   <rect x="41" y="138" width="15" height="52" rx="7" ${f('quads')}/><rect x="64" y="138" width="15" height="52" rx="7" ${f('quads')}/>`;
  const back=`<path d="M48 32 L72 32 L84 44 L60 56 L36 44 Z" ${f('upper')}/>
   <ellipse cx="31" cy="47" rx="9" ry="9" ${f('shoulders')}/><ellipse cx="89" cy="47" rx="9" ry="9" ${f('shoulders')}/>
   <rect x="51" y="57" width="18" height="24" rx="4" ${f('mid')}/>
   <path d="M38 50 L49 58 L51 98 L41 88 Z" ${f('lats')}/><path d="M82 50 L71 58 L69 98 L79 88 Z" ${f('lats')}/>
   <ellipse cx="26.5" cy="64" rx="5.5" ry="13" ${f('triceps')}/><ellipse cx="93.5" cy="64" rx="5.5" ry="13" ${f('triceps')}/>
   <ellipse cx="51" cy="127" rx="10" ry="9" ${f('glutes')}/><ellipse cx="69" cy="127" rx="10" ry="9" ${f('glutes')}/>
   <rect x="41" y="142" width="15" height="48" rx="7" ${f('hams')}/><rect x="64" y="142" width="15" height="48" rx="7" ${f('hams')}/>`;
  return `<figure class="fig"><svg viewBox="0 0 120 250" role="img" aria-label="${side==='f'?'Önden':'Arkadan'} çalışan kaslar">${base}${side==='f'?front:back}</svg><figcaption>${side==='f'?'Ön':'Arka'}</figcaption></figure>`;
}
function karneView(){
  const W=weekStats(),max=Math.max(10,...Object.values(W.c));
  const tile=(l,v)=>`<div class="tile"><span class="lbl">${l}</span><strong>${v}</strong></div>`;
  return `<p class="note" style="text-align:center">Son 7 gün</p>
  <div class="tiles">${tile('Antrenman',W.w)}${tile('Set',W.sets)}${tile('Hacim',volTxt(W.vol))}${tile('Süre',W.mins+'<small> dk</small>')}</div>
  <section class="panel"><div class="figs">${bodySVG(W.c,'f')}${bodySVG(W.c,'b')}</div>
    <div class="legend"><span><i style="background:${lvlFill(0)}"></i>0</span><span><i style="background:${lvlFill(1)}"></i>1-3 set</span><span><i style="background:${lvlFill(5)}"></i>4-7</span><span><i style="background:${lvlFill(9)}"></i>8+</span></div>
    ${W.w?'':'<p class="note" style="text-align:center">İlk antrenmanını kaydedince çalışan kasların burada renklenir.</p>'}</section>
  <section class="panel"><span class="lbl">Kas grubu başına haftalık set</span>
    <div class="bars">${Object.entries(MUSCLE).map(([m,n])=>`<div class="bar"><span>${n}</span><span class="track"><i style="width:${(W.c[m]/max*100).toFixed(0)}%"></i></span><b>${W.c[m]}</b></div>`).join('')}</div>
    <p class="note">Her kas grubu için haftada 6-12 set iyi bir hedef.</p></section>`;
}

/* ---------- Events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b){if(ev.target.classList&&ev.target.classList.contains('sheet'))closeSheet();return}
  if(b.dataset.close){closeSheet();return}
  if(b.dataset.play){openPlayer(b.dataset.play);return}
  if(b.dataset.pclose){closePlayer();return}
  if(b.dataset.vmode){vmode=b.dataset.vmode;lsSet('ad-vmode',vmode);const art=b.closest('article');if(art){const k=art.id.slice(3);art.outerHTML=exCard(k);mountAnims()}return}
  if(b.dataset.sum){const x=sessions.find(z=>z.id===b.dataset.sum);if(x)showSummary(x,sessions.filter(z=>(z.createdAt||0)<(x.createdAt||0)));return}
  if(b.dataset.plan){const [p,dd]=b.dataset.plan.split('-');prog=p;day=dd;lsSet('ad-prog',prog);openEx=null;saveErr='';render();return}
  if(b.dataset.open){openEx=b.dataset.open;try{history.pushState({ex:openEx},'')}catch(e){}render();window.scrollTo(0,0);return}
  if(b.dataset.goto){openEx=b.dataset.goto;try{history.replaceState({ex:openEx},'')}catch(e){}render();window.scrollTo(0,0);return}
  if(b.dataset.back){const k=openEx;if(history.state&&history.state.ex){history.back()}else{openEx=null;render()}setTimeout(()=>{const r=document.querySelector('[data-open="'+k+'"]');if(r)r.scrollIntoView({block:'center'})},80);return}
  if(b.dataset.tab){openEx=null;tab=b.dataset.tab;lsSet('ad-tab',tab);pendingDel=null;render();window.scrollTo(0,0);return}
  if(b.dataset.act==='rest-add'){timer.end=Math.max(timer.end,Date.now())+30000;timer.total+=30;if(!timer.iv){timer.iv=setInterval(tick,250);$('#rest').classList.remove('ready')}tick();return}
  if(b.dataset.act==='rest-skip'){clearInterval(timer.iv);timer.iv=null;$('#rest').hidden=true;return}
  if(b.dataset.prog){prog=b.dataset.prog;lsSet('ad-prog',prog);day=null;saveErr='';render();return}
  if(b.dataset.day){day=b.dataset.day;saveErr='';render();return}
  if(b.dataset.chk){
    const k=b.dataset.chk,i=+b.dataset.i,e=LIB[k],sets=exSets(k),x=sets[i];
    x.done=!x.done;
    if(x.done){
      if(x.reps==='')x.reps=String(e.reps);
      const dd=getDraft();if(!dd.startedAt)dd.startedAt=Date.now();
      if(e.t==='kg'&&x.kg===''){const L=lastFor(k);const v=L&&L.sets[0].kg!=null?String(L.sets[0].kg):'';sets.forEach(z=>{if(z.kg==='')z.kg=v})}
      const nextIdx=sets.findIndex(z=>!z.done);
      let label;if(nextIdx>=0)label=e.n+' · set '+(nextIdx+1);else{const list=PROGRAMS[prog].days[day].ex.filter(z=>!(noLegs&&LIB[z].leg));const n=list[list.indexOf(k)+1];label=n?LIB[n].n:'Son hareket bitti'}
      const sup=e.ss&&nextIdx>=0;
      startRest(sup?20:e.rest,sup?LIB[e.ss].n+' (süper set)':label);
    }
    saveDrafts();const card=$('#ex-'+k);if(card){card.outerHTML=exCard(k);mountAnims()}
    const f=$('#finish');if(f){const list=PROGRAMS[prog].days[day].ex.filter(z=>!(noLegs&&LIB[z].leg));f.textContent=`Antrenmanı bitir · ${list.reduce((n,z)=>n+exSets(z).filter(q=>q.done).length,0)}/${list.reduce((n,z)=>n+LIB[z].s,0)} set`}
    return;
  }
  if(b.id==='finish'){finish();return}
  if(b.id==='exp'){exportData();return}
  if(b.id==='reset'){if(b.dataset.armed){delete drafts[draftKey()];saveDrafts();render()}else{b.dataset.armed='1';b.textContent='Emin misin? Tekrar dokun'}return}
  if(b.dataset.del){const id=b.dataset.del;if(pendingDel!==id){pendingDel=id;b.textContent='Silmek için tekrar dokun';return}pendingDel=null;try{await delSession(id);render();toast('Antrenman silindi')}catch(e){toast('Silinemedi, tekrar dene')}return}
  if(b.id==='w-add'){const kg=num($('#w-kg').value),d=$('#w-date').value;if(!kg||!d){toast('Tarih ve kilo gir');return}try{await setWeight(d,kg);render();toast('Kilo eklendi')}catch(e){toast('Kaydedilemedi, tekrar dene')}return}
  if(b.dataset.wdel){try{await delWeight(b.dataset.wdel);if(!db)render()}catch(e){toast('Silinemedi')}return}
});
window.addEventListener('popstate',()=>{if(openEx){openEx=null;render()}});
document.addEventListener('change',ev=>{if(ev.target.id==='noleg'){noLegs=ev.target.checked;render()}});
let saveT=null;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.f==='kgall'){exSets(t.dataset.k).forEach(x=>x.kg=t.value)}
  else if(t.dataset.f){const sets=exSets(t.dataset.k);sets[+t.dataset.i][t.dataset.f]=t.value}
  else if(t.id==='cardio'){getDraft().cardio=t.value}
  else return;
  clearTimeout(saveT);saveT=setTimeout(saveDrafts,300);
});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(pendingRender&&!(a&&a.tagName==='INPUT'))render()},50)});

/* ---------- Boot ---------- */
mode='local';loadLocal();render();
document.addEventListener('change',ev=>{if(ev.target.id==='imp'&&ev.target.files[0]){importData(ev.target.files[0]);ev.target.value=''}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
